/* global XLSX */

const ACCENT_PRESETS = [
  { name: "Blue", hex: "#0071E3" },
  { name: "Green", hex: "#34C759" },
  { name: "Orange", hex: "#FF9500" },
  { name: "Red", hex: "#FF3B30" },
  { name: "Purple", hex: "#AF52DE" },
  { name: "Pink", hex: "#FF2D55" },
  { name: "Teal", hex: "#30B0C7" },
  { name: "Graphite", hex: "#3A3A3C" },
];

const DEFAULT_CATEGORIES = [
  { id: "outdoors", name: "Outdoors & Views", color: "#34C759" },
  { id: "museums", name: "Museums & Culture", color: "#007AFF" },
  { id: "food", name: "Food & Drink", color: "#FF3B30" },
  { id: "nightlife", name: "Nightlife & Entertainment", color: "#AF52DE" },
  { id: "stayin", name: "Stay-In", color: "#8E8E93" },
  { id: "classes", name: "Classes & Workshops", color: "#FF2D55" },
  { id: "active", name: "Active", color: "#30B0C7" },
];

const NONE_CATEGORY_ID = "none";
const NONE_CATEGORY = { id: NONE_CATEGORY_ID, name: "Uncategorized", color: "#8E8E93" };

const seed = (name, category, cost, location, setting, weather, prep, notes) => ({
  id: `seed-${Math.random().toString(36).slice(2, 10)}`,
  name, category, cost, location, setting, weather, prep, notes,
  done: false, doneDate: null,
});

const DEFAULT_ACTIVITIES = [];

const COST_LABEL = ["Free", "$", "$$", "$$$", "$$$$"];
const COST_VALUES = [0, 1, 2, 3, 4];
function costDisplay(costArr) {
  const arr = Array.isArray(costArr) ? costArr : [costArr ?? 1];
  if (!arr.length) return "—";
  return [...arr].sort((a, b) => a - b).map((c) => COST_LABEL[c] ?? "$").join(" / ");
}
const LOCATIONS = ["Indoor", "Outdoor", "Either"];
const LOCATION_FILTERS = ["Indoor", "Outdoor"];
const SETTINGS_OPT = ["Home", "Away", "Either"];
const WEATHERS = ["Any", "Good weather", "Rain OK"];
const PREPS = ["None", "Needs planning"];
const COUNT_PRESETS = [1, 3, 5, 10];

function normalizeActivity(a, categories) {
  const catIds = categories.map((c) => c.id).concat(NONE_CATEGORY_ID);
  const rawCost = Array.isArray(a?.cost) ? a.cost : a?.cost !== undefined ? [a.cost] : [1];
  const cleanCost = rawCost.filter((n) => Number.isInteger(n) && n >= 0 && n <= 4);
  return {
    id: a?.id || uid(),
    name: typeof a?.name === "string" && a.name.trim() ? a.name : "Untitled activity",
    category: catIds.includes(a?.category) ? a.category : NONE_CATEGORY_ID,
    cost: cleanCost.length ? cleanCost : [1],
    location: LOCATIONS.includes(a?.location) ? a.location : "Indoor",
    setting: SETTINGS_OPT.includes(a?.setting) ? a.setting : "Away",
    weather: WEATHERS.includes(a?.weather) ? a.weather : "Any",
    prep: PREPS.includes(a?.prep) ? a.prep : "None",
    notes: typeof a?.notes === "string" ? a.notes : "",
    done: !!a?.done,
    doneDate: a?.doneDate || null,
  };
}

// ---------- Storage ----------

async function loadKey(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw === null) return fallback;
    return JSON.parse(raw);
  } catch {
    return fallback;
  }
}
async function saveKey(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    console.error("storage save failed", e);
  }
}

const uid = () => Math.random().toString(36).slice(2, 10);

// ---------- Passcode + encryption ----------

async function sha256Hex(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}
function toB64(bytes) {
  let s = "";
  bytes.forEach((b) => (s += String.fromCharCode(b)));
  return btoa(s);
}
function fromB64(str) {
  return Uint8Array.from(atob(str), (c) => c.charCodeAt(0));
}
async function deriveKey(passphrase, saltBytes) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: saltBytes, iterations: 150000, hash: "SHA-256" },
    base,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}
async function encryptBackup(obj, passphrase) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(passphrase, salt);
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { v: 1, salt: toB64(salt), iv: toB64(iv), ct: toB64(new Uint8Array(ct)) };
}
async function decryptBackup(blob, passphrase) {
  const salt = fromB64(blob.salt);
  const iv = fromB64(blob.iv);
  const key = await deriveKey(passphrase, salt);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, fromB64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

const SEED_FILE_NAME = "./data.json";

async function fetchSeedBlob() {
  try {
    const res = await fetch(SEED_FILE_NAME, { cache: "no-store" });
    if (!res.ok) return null;
    const json = await res.json();
    if (json && json.ct && json.iv && json.salt) return json;
    return null;
  } catch {
    return null;
  }
}

// ---------- Import field parsing ----------

const FIELD_ALIASES = {
  name: ["activity", "name", "title"],
  category: ["category", "type"],
  cost: ["cost", "price"],
  location: ["location", "indoor/outdoor", "indoor"],
  setting: ["setting", "home/away"],
  weather: ["weather"],
  prep: ["prep", "preperation", "preparation"],
  notes: ["notes", "info", "description"],
};

function guessColumn(headers, field) {
  const aliases = FIELD_ALIASES[field] || [];
  const lower = headers.map((h) => String(h).toLowerCase());
  for (const alias of aliases) {
    const idx = lower.findIndex((h) => h === alias);
    if (idx !== -1) return headers[idx];
  }
  for (const alias of aliases) {
    const idx = lower.findIndex((h) => h.includes(alias));
    if (idx !== -1) return headers[idx];
  }
  return "";
}

function parseCostMulti(raw) {
  if (raw === null || raw === undefined || raw === "") return [1];
  if (typeof raw === "number") return [Math.min(4, Math.max(0, Math.round(raw)))];
  const s = String(raw).trim();
  if (!s) return [1];
  if (/free/i.test(s) && !/\$/.test(s) && !/\d/.test(s)) return [0];

  const tiers = new Set();
  if (/free/i.test(s)) tiers.add(0);
  const dollarRuns = s.match(/\${1,4}/g);
  if (dollarRuns) dollarRuns.forEach((run) => tiers.add(Math.min(4, run.length)));
  if (!dollarRuns && !tiers.size) {
    const nums = s.match(/\d+/g);
    if (nums) nums.forEach((n) => tiers.add(Math.min(4, Math.max(0, parseInt(n, 10)))));
  }
  if (!tiers.size) return [1];
  return [...tiers].sort((a, b) => a - b);
}
function parseLocation(raw) {
  const s = String(raw || "").toLowerCase();
  if (s.includes("out")) return "Outdoor";
  if (s.includes("either") || s.includes("any")) return "Either";
  return "Indoor";
}
function parseSetting(raw) {
  const s = String(raw || "").toLowerCase();
  if (s.includes("home")) return "Home";
  if (s.includes("either") || s.includes("any")) return "Either";
  return "Away";
}
function parseWeather(raw) {
  const s = String(raw || "").toLowerCase();
  if (s.includes("rain")) return "Rain OK";
  if (s.includes("good") || s.includes("sun") || s.includes("dry")) return "Good weather";
  return "Any";
}
function parsePrep(raw) {
  const s = String(raw || "").toLowerCase();
  if (!s || s.includes("none")) return "None";
  return "Needs planning";
}

// ---------- Theme ----------

function getTheme(mode, accent) {
  if (mode === "dark") {
    return {
      mode, accent,
      bg: "#000000", bgSubtle: "#1C1C1E", surface: "#1C1C1E", surfaceRaised: "#242426",
      border: "#38383A", text: "#F5F5F7", textSecondary: "#98989D", textTertiary: "#68686D",
      shadow: "0 1px 2px rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.35)",
      overlay: "rgba(0,0,0,0.6)",
    };
  }
  return {
    mode, accent,
    bg: "#FFFFFF", bgSubtle: "#F5F5F7", surface: "#FFFFFF", surfaceRaised: "#FFFFFF",
    border: "#E5E5EA", text: "#1D1D1F", textSecondary: "#6E6E73", textTertiary: "#AEAEB2",
    shadow: "0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.08)",
    overlay: "rgba(0,0,0,0.35)",
  };
}

// ---------- Component ----------

function DateIdeaPicker() {
  const [loaded, setLoaded] = useState(false);
  const [activities, setActivities] = useState([]);
  const [categories, setCategories] = useState([]);
  const [theme, setTheme] = useState("light");
  const [accent, setAccent] = useState(ACCENT_PRESETS[0].hex);
  const [page, setPage] = useState("picker");
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [confirmResetAll, setConfirmResetAll] = useState(false);

  const [passHash, setPassHash] = useState(null);
  const [unlocked, setUnlocked] = useState(false);
  const [lockMode, setLockMode] = useState("create");
  const [pendingSeedBlob, setPendingSeedBlob] = useState(null);
  const [sessionPass, setSessionPass] = useState("");
  const [passInput, setPassInput] = useState("");
  const [passConfirm, setPassConfirm] = useState("");
  const [lockError, setLockError] = useState("");
  const [backupBusy, setBackupBusy] = useState(false);
  const [backupMsg, setBackupMsg] = useState("");
  const backupFileRef = useRef(null);

  const [catFilter, setCatFilter] = useState([]);
  const [costFilter, setCostFilter] = useState([]);
  const [locFilter, setLocFilter] = useState(null);
  const [advOpen, setAdvOpen] = useState(false);
  const [weatherFilter, setWeatherFilter] = useState(null);
  const [settingFilter, setSettingFilter] = useState(null);
  const [prepFilter, setPrepFilter] = useState(null);
  const [includeDone, setIncludeDone] = useState(false);

  const [drawCount, setDrawCount] = useState(1);

  const [shuffling, setShuffling] = useState(false);
  const [results, setResults] = useState(null);
  const [flip, setFlip] = useState(false);
  const [emptyNotice, setEmptyNotice] = useState(false);

  const [search, setSearch] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [formError, setFormError] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [showCatManager, setShowCatManager] = useState(false);
  const [newCatName, setNewCatName] = useState("");
  const [newCatColor, setNewCatColor] = useState(CATEGORY_PALETTE[0]);

  const [categoryToDelete, setCategoryToDelete] = useState(null);
  const [catSelectMode, setCatSelectMode] = useState(false);
  const [selectedCatIds, setSelectedCatIds] = useState([]);
  const [bulkDeleteConfirm, setBulkDeleteConfirm] = useState(false);

  const [importOpen, setImportOpen] = useState(false);
  const [importStep, setImportStep] = useState("upload");
  const [importRows, setImportRows] = useState([]);
  const [importHeaders, setImportHeaders] = useState([]);
  const [fieldMap, setFieldMap] = useState({});
  const [skipDup, setSkipDup] = useState(true);
  const [importError, setImportError] = useState("");
  const fileInputRef = useRef(null);

  const blankForm = () => ({
    name: "", category: categories[0]?.id || "", cost: [1], location: "Indoor",
    setting: "Away", weather: "Any", prep: "None", notes: "",
  });
  const [form, setForm] = useState(blankForm());

  const initialized = useRef(false);

  useEffect(() => {
    if (initialized.current) return;
    initialized.current = true;
    (async () => {
      const acts = await loadKey("dc-date:activities", null);
      const cats = await loadKey("dc-date:categories", null);
      const settings = await loadKey("dc-date:settings", null);
      const storedHash = await loadKey("dc-date:passHash", null);

      if (storedHash) {
        setPassHash(storedHash);
        setLockMode("hash");
      } else {
        const seedBlob = await fetchSeedBlob();
        if (seedBlob) {
          setPendingSeedBlob(seedBlob);
          setLockMode("seed");
        } else {
          setLockMode("create");
        }
      }
      const finalCats = cats && cats.length ? cats : DEFAULT_CATEGORIES;
      const rawActs = acts && acts.length ? acts : DEFAULT_ACTIVITIES;
      let migrated = false;
      const finalActs = rawActs.map((a) => {
        const fixed = normalizeActivity(a, finalCats);
        if (JSON.stringify(fixed) !== JSON.stringify(a)) migrated = true;
        return fixed;
      });
      setCategories(finalCats);
      setActivities(finalActs);
      if (settings) {
        setTheme(settings.theme || "light");
        setAccent(settings.accent || ACCENT_PRESETS[0].hex);
      }
      if (!cats) await saveKey("dc-date:categories", finalCats);
      if (!acts || migrated) await saveKey("dc-date:activities", finalActs);
      setLoaded(true);
    })();
  }, []);

  const persistActivities = async (next) => {
    setActivities(next);
    await saveKey("dc-date:activities", next);
  };
  const persistCategories = async (next) => {
    setCategories(next);
    await saveKey("dc-date:categories", next);
  };
  const persistSettings = async (nextTheme, nextAccent) => {
    await saveKey("dc-date:settings", { theme: nextTheme, accent: nextAccent });
  };

  const T = useMemo(() => getTheme(theme, accent), [theme, accent]);
  const S = useMemo(() => mkStyles(T), [T]);

  const catById = (id) => (id === NONE_CATEGORY_ID ? NONE_CATEGORY : categories.find((c) => c.id === id));

  function matches(a) {
    if (!includeDone && a.done) return false;
    if (catFilter.length && !catFilter.includes(a.category)) return false;
    if (costFilter.length && !(Array.isArray(a.cost) ? a.cost : [a.cost]).some((c) => costFilter.includes(c))) return false;
    if (locFilter && a.location !== locFilter && a.location !== "Either") return false;
    if (weatherFilter && a.weather !== weatherFilter && a.weather !== "Any") return false;
    if (settingFilter && a.setting !== settingFilter && a.setting !== "Either") return false;
    if (prepFilter && a.prep !== prepFilter) return false;
    return true;
  }

  function toggleMulti(arr, setArr, val) {
    setArr(arr.includes(val) ? arr.filter((v) => v !== val) : [...arr, val]);
  }
  function toggleSingle(cur, setCur, val) {
    setCur(cur === val ? null : val);
  }

  function setCount(n) {
    if (n === "all") {
      setDrawCount("all");
      return;
    }
    const clamped = Math.max(1, Math.min(50, n || 1));
    setDrawCount(clamped);
  }

  function draw() {
    const pool = [...activities.filter(matches)];
    if (!pool.length) {
      setEmptyNotice(true);
      setResults(null);
      return;
    }
    setEmptyNotice(false);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    const limit = drawCount === "all" ? pool.length : drawCount;
    const picks = pool.slice(0, limit);

    setShuffling(true);
    setFlip(false);
    setResults(null);
    setTimeout(() => {
      setResults(picks);
      setShuffling(false);
      if (picks.length === 1) setTimeout(() => setFlip(true), 30);
    }, 500);
  }

  function toggleDone(id) {
    const next = activities.map((a) =>
      a.id === id ? { ...a, done: !a.done, doneDate: !a.done ? new Date().toISOString().slice(0, 10) : null } : a
    );
    persistActivities(next);
  }
  function deleteActivity(id) {
    persistActivities(activities.filter((a) => a.id !== id));
    if (results) setResults(results.filter((a) => a.id !== id));
  }
  function openEdit(a) {
    const fixed = normalizeActivity(a, categories);
    setEditingId(fixed.id);
    setForm({ name: fixed.name, category: fixed.category, cost: fixed.cost, location: fixed.location, setting: fixed.setting, weather: fixed.weather, prep: fixed.prep, notes: fixed.notes });
    setFormError("");
    setShowForm(true);
  }
  function openAdd() {
    setEditingId(null);
    setForm(blankForm());
    setFormError("");
    setShowForm(true);
  }
  function submitForm(e) {
    e.preventDefault();
    setFormError("");
    if (!form.name.trim() || !form.category) {
      setFormError("Give it a name and a category before saving.");
      return;
    }
    try {
      if (editingId) {
        const next = activities.map((a) => (a.id === editingId ? normalizeActivity({ ...a, ...form }, categories) : a));
        persistActivities(next);
      } else {
        const next = [...activities, normalizeActivity({ id: uid(), ...form, done: false, doneDate: null }, categories)];
        persistActivities(next);
      }
      setShowForm(false);
    } catch (err) {
      console.error(err);
      setFormError(`Couldn't save: ${err.message || "something went wrong"}. This is a bug — tell me exactly what you filled in and I'll fix it.`);
    }
  }
 function addCategory() {
    if (!newCatName.trim()) return;
    persistCategories([...categories, { id: uid(), name: newCatName.trim(), color: newCatColor }]);
    setNewCatName("");
  }
  function renameCategory(id, name) {
    if (!name.trim()) return;
    persistCategories(categories.map((c) => (c.id === id ? { ...c, name: name.trim() } : c)));
  }
  function recolorCategory(id, color) {
    persistCategories(categories.map((c) => (c.id === id ? { ...c, color } : c)));
  }

  function requestDeleteCategory(cat) {
    setCategoryToDelete(cat);
  }
  async function confirmDeleteCategory() {
    if (!categoryToDelete) return;
    const nextActs = activities.map((a) =>
      a.category === categoryToDelete.id ? { ...a, category: NONE_CATEGORY_ID } : a
    );
    await persistActivities(nextActs);
    await persistCategories(categories.filter((c) => c.id !== categoryToDelete.id));
    setCategoryToDelete(null);
  }
  function toggleCatSelect(id) {
    setSelectedCatIds((cur) => (cur.includes(id) ? cur.filter((x) => x !== id) : [...cur, id]));
  }
  async function confirmBulkDeleteCategories() {
    const idsToDelete = new Set(selectedCatIds);
    const nextActs = activities.map((a) =>
      idsToDelete.has(a.category) ? { ...a, category: NONE_CATEGORY_ID } : a
    );
    await persistActivities(nextActs);
    await persistCategories(categories.filter((c) => !idsToDelete.has(c.id)));
    setSelectedCatIds([]);
    setCatSelectMode(false);
    setBulkDeleteConfirm(false);
  }

  // ---------- Import ----------

  function handleFileSelect(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setImportError("");
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const wb = XLSX.read(evt.target.result, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        if (!rows.length) {
          setImportError("That sheet looks empty.");
          return;
        }
        const headers = Object.keys(rows[0]);
        const guessed = {};
        Object.keys(FIELD_ALIASES).forEach((f) => (guessed[f] = guessColumn(headers, f)));
        setImportHeaders(headers);
        setImportRows(rows);
        setFieldMap(guessed);
        setImportStep("map");
      } catch (err) {
        setImportError("Couldn't read that file. Try an .xlsx or .csv export.");
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function transformRow(row) {
    const nameVal = fieldMap.name ? row[fieldMap.name] : "";
    const catRaw = fieldMap.category ? row[fieldMap.category] : "";
    return {
      name: String(nameVal || "").trim(),
      categoryRaw: String(catRaw || "").trim(),
      cost: parseCostMulti(fieldMap.cost ? row[fieldMap.cost] : ""),
      location: parseLocation(fieldMap.location ? row[fieldMap.location] : ""),
      setting: parseSetting(fieldMap.setting ? row[fieldMap.setting] : ""),
      weather: parseWeather(fieldMap.weather ? row[fieldMap.weather] : ""),
      prep: parsePrep(fieldMap.prep ? row[fieldMap.prep] : ""),
      notes: fieldMap.notes ? String(row[fieldMap.notes] || "") : "",
    };
  }

  function confirmImport() {
    let cats = [...categories];
    let colorCursor = cats.length;
    const existingNames = new Set(activities.map((a) => a.name.trim().toLowerCase()));
    const newActs = [];

    importRows.forEach((row) => {
      const t = transformRow(row);
      if (!t.name) return;
      if (skipDup && existingNames.has(t.name.toLowerCase())) return;

      let cat = t.categoryRaw
        ? cats.find((c) => c.name.toLowerCase() === t.categoryRaw.toLowerCase())
        : null;
      if (!cat && t.categoryRaw) {
        cat = { id: uid(), name: t.categoryRaw, color: CATEGORY_PALETTE[colorCursor % CATEGORY_PALETTE.length] };
        colorCursor++;
        cats.push(cat);
      }
      if (!cat) cat = cats[0];

      newActs.push({
        id: uid(), name: t.name, category: cat.id, cost: t.cost, location: t.location,
        setting: t.setting, weather: t.weather, prep: t.prep, notes: t.notes,
        done: false, doneDate: null,
      });
      existingNames.add(t.name.toLowerCase());
    });

    persistCategories(cats);
    persistActivities([...activities, ...newActs]);
    setImportOpen(false);
    setImportStep("upload");
    setImportRows([]);
    if (fileInputRef.current) fileInputRef.current.value = "";
  }

  const doneCount = activities.filter((a) => a.done).length;
  const filteredList = activities.filter((a) => a.name.toLowerCase().includes(search.toLowerCase()));

  function changeTheme(m) {
    setTheme(m);
    persistSettings(m, accent);
  }
  function changeAccent(hex) {
    setAccent(hex);
    persistSettings(theme, hex);
  }

  // ---------- Passcode ----------

  async function createPasscode(e) {
    e.preventDefault();
    setLockError("");
    if (passInput.length < 8) {
      setLockError("Use at least 8 characters — this doubles as your backup encryption key.");
      return;
    }
    if (passInput !== passConfirm) {
      setLockError("Those don't match.");
      return;
    }
    try {
      const hash = await sha256Hex(passInput);
      await saveKey("dc-date:passHash", hash);
      setPassHash(hash);
      setSessionPass(passInput);
      setUnlocked(true);
    } catch (err) {
      setLockError("Something went wrong creating that passcode — try again.");
      console.error(err);
    }
  }

  async function tryUnlock(e) {
    e.preventDefault();
    setLockError("");
    try {
      const hash = await sha256Hex(passInput);
      if (hash === passHash) {
        setSessionPass(passInput);
        setUnlocked(true);
      } else {
        setLockError("Incorrect passcode.");
      }
    } catch (err) {
      setLockError("Something went wrong unlocking — try again.");
      console.error(err);
    }
  }

  async function unlockFromSeed(e) {
    e.preventDefault();
    setLockError("");
    try {
      const data = await decryptBackup(pendingSeedBlob, passInput);
      if (!data.activities || !data.categories) throw new Error("bad shape");
      const hash = await sha256Hex(passInput);
      setActivities(data.activities);
      setCategories(data.categories);
      await saveKey("dc-date:activities", data.activities);
      await saveKey("dc-date:categories", data.categories);
      await saveKey("dc-date:passHash", hash);
      setPassHash(hash);
      setSessionPass(passInput);
      setUnlocked(true);
    } catch (err) {
      setLockError("Couldn't unlock — wrong passcode, or the file wasn't a backup from this app.");
    }
  }

  async function resetPasscode() {
    await saveKey("dc-date:passHash", null);
    setPassHash(null);
    setUnlocked(false);
    setLockMode("create");
    setPendingSeedBlob(null);
    setPassInput("");
    setPassConfirm("");
    setSessionPass("");
  }

  async function resetAllData() {
    await saveKey("dc-date:activities", DEFAULT_ACTIVITIES);
    await saveKey("dc-date:categories", DEFAULT_CATEGORIES);
    await saveKey("dc-date:passHash", null);
    await saveKey("dc-date:settings", null);
    setActivities(DEFAULT_ACTIVITIES);
    setCategories(DEFAULT_CATEGORIES);
    setTheme("light");
    setAccent(ACCENT_PRESETS[0].hex);
    setPassHash(null);
    setUnlocked(false);
    setLockMode("create");
    setPendingSeedBlob(null);
    setPassInput("");
    setPassConfirm("");
    setSessionPass("");
    setSettingsOpen(false);
  }

  // ---------- Encrypted backup ----------

  async function exportBackup() {
    setBackupBusy(true);
    setBackupMsg("");
    try {
      const blob = await encryptBackup({ activities, categories }, sessionPass);
      const text = JSON.stringify(blob, null, 2);
      const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
      const a = document.createElement("a");
      a.href = url;
      a.download = "dc-dates-backup.json";
      a.click();
      URL.revokeObjectURL(url);
      setBackupMsg("Downloaded — commit this file to your repo to sync it.");
    } catch (err) {
      setBackupMsg("Export failed — try again.");
    }
    setBackupBusy(false);
  }

  function handleBackupFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setBackupBusy(true);
    setBackupMsg("");
    const reader = new FileReader();
    reader.onload = async (evt) => {
      try {
        const blob = JSON.parse(evt.target.result);
        const data = await decryptBackup(blob, sessionPass);
        if (!data.activities || !data.categories) throw new Error("bad shape");
        setActivities(data.activities);
        setCategories(data.categories);
        await saveKey("dc-date:activities", data.activities);
        await saveKey("dc-date:categories", data.categories);
        setBackupMsg(`Loaded ${data.activities.length} activities from backup.`);
      } catch (err) {
        setBackupMsg("Couldn't decrypt that file — wrong passcode, or it's not a backup from this app.");
      }
      setBackupBusy(false);
      if (backupFileRef.current) backupFileRef.current.value = "";
    };
    reader.readAsText(file);
  }

  if (!loaded) {
    return (
      <div style={{ ...S.page, display: "flex", alignItems: "center", justifyContent: "center", height: 300 }}>
        <div style={{ color: S.T.textSecondary, fontSize: 14 }}>Loading…</div>
      </div>
    );
  }

  if (!unlocked) {
    return (
      <LockScreen
        S={S} T={T}
        mode={lockMode}
        passInput={passInput} setPassInput={setPassInput}
        passConfirm={passConfirm} setPassConfirm={setPassConfirm}
        lockError={lockError}
        onSubmit={lockMode === "create" ? createPasscode : lockMode === "seed" ? unlockFromSeed : tryUnlock}
      />
    );
  }

  return (
    <div style={S.page}>
      <style>{`
        @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
        .dc-in { animation: fadeUp .3s ease both; }
        .dc-blink { animation: blink 1.1s infinite ease-in-out; }
        .dc-flip-outer { perspective: 1400px; }
        .dc-flip-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,.15,.2,1); }
        .dc-flip-inner.flipped { transform: rotateY(180deg); }
        .dc-flip-face { position: absolute; inset: 0; backface-visibility: hidden; }
        .dc-flip-back { transform: rotateY(180deg); }
        .dc-chip { cursor: pointer; transition: filter .12s ease, transform .12s ease; }
        .dc-chip:active { transform: scale(0.97); }
        .dc-btn { cursor: pointer; transition: opacity .12s ease, transform .12s ease; }
        .dc-btn:hover { opacity: 0.88; }
        .dc-btn:active { transform: scale(0.98); }
        .dc-row:hover { background: ${T.bgSubtle}; }
        .dc-tab { cursor: pointer; }
        input, select, textarea, button { font-family: inherit; }
        ::placeholder { color: ${T.textTertiary}; }
        table { border-collapse: collapse; width: 100%; }
      `}</style>

      <div style={S.topbar}>
        <div style={S.tabs}>
          {[["picker", "Picker"], ["manage", "Manage"], ["stats", "Stats & History"]].map(([id, label]) => (
            <div key={id} className="dc-tab" onClick={() => setPage(id)} style={{ ...S.tab, ...(page === id ? S.tabActive : {}) }}>
              {label}
            </div>
          ))}
        </div>
        <div style={{ position: "relative" }}>
          <button className="dc-btn" style={S.gearBtn} onClick={() => setSettingsOpen(!settingsOpen)} aria-label="Settings">⚙</button>
          {settingsOpen && (
            <div style={S.settingsPop} className="dc-in">
              <div style={S.filterLabel}>Appearance</div>
              <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
                {["light", "dark"].map((m) => (
                  <div key={m} className="dc-chip" onClick={() => changeTheme(m)}
                    style={{ ...S.segItem, background: theme === m ? T.text : "transparent", color: theme === m ? T.bg : T.text, borderColor: T.border, flex: 1, textAlign: "center" }}>
                    {m === "light" ? "Light" : "Dark"}
                  </div>
                ))}
              </div>
              <div style={S.filterLabel}>Accent color</div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
                {ACCENT_PRESETS.map((c) => (
                  <span key={c.hex} onClick={() => changeAccent(c.hex)} title={c.name}
                    style={{ width: 24, height: 24, borderRadius: "50%", background: c.hex, cursor: "pointer", display: "inline-block", border: accent === c.hex ? `2px solid ${T.text}` : "2px solid transparent", boxShadow: accent === c.hex ? `0 0 0 2px ${T.bg}` : "none" }} />
                ))}
              </div>
              <div style={{ borderTop: `1px dashed ${T.border}`, paddingTop: 10, display: "flex", flexDirection: "column", gap: 6 }}>
                <button className="dc-btn" style={{ ...S.linkBtn, fontSize: 12, color: "#FF3B30" }} onClick={resetPasscode}>
                  Reset passcode
                </button>
                <button className="dc-btn" style={{ ...S.linkBtn, fontSize: 12, color: "#FF3B30" }}
                  onClick={() => {
                    if (confirmResetAll) resetAllData();
                    else { setConfirmResetAll(true); setTimeout(() => setConfirmResetAll(false), 4000); }
                  }}>
                  {confirmResetAll ? "Click again to erase everything" : "Reset all data"}
                </button>
              </div>
            </div>
          )}
        </div>
      </div>

      {page === "picker" && (
        <PickerPage
          T={T} S={S}
          categories={categories} catFilter={catFilter} setCatFilter={setCatFilter}
          costFilter={costFilter} setCostFilter={setCostFilter}
          locFilter={locFilter} setLocFilter={setLocFilter}
          advOpen={advOpen} setAdvOpen={setAdvOpen}
          weatherFilter={weatherFilter} setWeatherFilter={setWeatherFilter}
          settingFilter={settingFilter} setSettingFilter={setSettingFilter}
          prepFilter={prepFilter} setPrepFilter={setPrepFilter}
          includeDone={includeDone} setIncludeDone={setIncludeDone}
          toggleMulti={toggleMulti} toggleSingle={toggleSingle}
          drawCount={drawCount} setCount={setCount}
          draw={draw} shuffling={shuffling} results={results} flip={flip}
          emptyNotice={emptyNotice} catById={catById} toggleDone={toggleDone}
        />
      )}

      {page === "manage" && (
        <ManagePage
          T={T} S={S}
          activities={filteredList} allCount={activities.length}
          search={search} setSearch={setSearch}
          categories={categories} catById={catById}
          openAdd={openAdd} openEdit={openEdit} deleteActivity={deleteActivity} toggleDone={toggleDone}
          showCatManager={showCatManager} setShowCatManager={setShowCatManager}
          newCatName={newCatName} setNewCatName={setNewCatName}
          newCatColor={newCatColor} setNewCatColor={setNewCatColor}
          addCategory, renameCategory, recolorCategory, requestDeleteCategory, openImport,
          renameCategory={renameCategory}
          recolorCategory={recolorCategory}
          requestDeleteCategory={requestDeleteCategory}
          catSelectMode={catSelectMode} setCatSelectMode={setCatSelectMode}
          selectedCatIds={selectedCatIds} toggleCatSelect={toggleCatSelect}
          setBulkDeleteConfirm={setBulkDeleteConfirm}
          openImport={() => { setImportOpen(true); setImportStep("upload"); setImportError(""); }}
          exportBackup={exportBackup} handleBackupFile={handleBackupFile} backupFileRef={backupFileRef}
          backupBusy={backupBusy} backupMsg={backupMsg}
        />
      )}

      {page === "stats" && (
        <StatsPage T={T} S={S} activities={activities} categories={categories} catById={catById} toggleDone={toggleDone} doneCount={doneCount} />
      )}

      {showForm && (
        <div style={S.overlay} onClick={() => setShowForm(false)}>
          <form style={S.formBox} onClick={(e) => e.stopPropagation()} onSubmit={submitForm}>
            <div style={S.formTitle}>{editingId ? "Edit activity" : "Add activity"}</div>
            <label style={S.formLabel}>Name</label>
            <input required style={S.input} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="e.g. Sunset at Gravelly Point" />
            <label style={S.formLabel}>Category</label>
            <select style={S.input} value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>
              {categories.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            <div style={{ marginBottom: 4 }}>
              <label style={S.formLabel}>Cost (select all that apply)</label>
              <div style={{ ...S.chipRow, marginBottom: 10 }}>
                {COST_VALUES.map((n) => {
                  const active = form.cost.includes(n);
                  return (
                    <div key={n} className="dc-chip"
                      onClick={() => {
                        const next = active ? form.cost.filter((c) => c !== n) : [...form.cost, n];
                        setForm({ ...form, cost: next.length ? next : [n] });
                      }}
                      style={{ ...S.chipSm, borderColor: T.accent, background: active ? T.accent : "transparent", color: active ? "#FFFFFF" : T.text }}>
                      {COST_LABEL[n]}
                    </div>
                  );
                })}
              </div>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <div style={{ flex: 1 }}>
                <label style={S.formLabel}>Location</label>
                <select style={S.input} value={form.location} onChange={(e) => setForm({ ...form, location: e.target.value })}>
                  {LOCATIONS.map((l) => <option key={l} value={l}>{l}</option>)}
                </select>
              </div>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <div style={{ flex: 1 }}>
                <label style={S.formLabel}>Home / away</label>
                <select style={S.input} value={form.setting} onChange={(e) => setForm({ ...form, setting: e.target.value })}>
                  {SETTINGS_OPT.map((s) => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              <div style={{ flex: 1 }}>
                <label style={S.formLabel}>Weather</label>
                <select style={S.input} value={form.weather} onChange={(e) => setForm({ ...form, weather: e.target.value })}>
                  {WEATHERS.map((w) => <option key={w} value={w}>{w}</option>)}
                </select>
              </div>
              <div style={{ flex: 1 }}>
                <label style={S.formLabel}>Prep</label>
                <select style={S.input} value={form.prep} onChange={(e) => setForm({ ...form, prep: e.target.value })}>
                  {PREPS.map((p) => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>
            </div>
            <label style={S.formLabel}>Notes (optional)</label>
            <textarea style={{ ...S.input, minHeight: 60, resize: "vertical" }} value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} />
            {formError && <div style={{ color: "#FF3B30", fontSize: 12.5, marginTop: 4, marginBottom: 6, lineHeight: 1.4 }}>{formError}</div>}
            <div style={{ display: "flex", gap: 10, marginTop: 14, justifyContent: "flex-end" }}>
              <button type="button" className="dc-btn" style={S.btnGhost} onClick={() => setShowForm(false)}>Cancel</button>
              <button type="submit" className="dc-btn" style={S.btnPrimary}>{editingId ? "Save changes" : "Add activity"}</button>
            </div>
          </form>
        </div>
      )}

      {importOpen && (
        <div style={S.overlay} onClick={() => setImportOpen(false)}>
          <div style={{ ...S.formBox, maxWidth: 560 }} onClick={(e) => e.stopPropagation()}>
            <div style={S.formTitle}>Import from Excel</div>
            {importStep === "upload" && (
              <>
                <div style={{ color: T.textSecondary, fontSize: 13.5, marginBottom: 16, lineHeight: 1.5 }}>
                  Upload an .xlsx, .xls, or .csv file. The first row should be column headers — I'll try to match them automatically, and you can fix anything that's off before importing.
                </div>
                <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv" onChange={handleFileSelect} style={{ marginBottom: 10 }} />
                {importError && <div style={{ color: "#FF3B30", fontSize: 13 }}>{importError}</div>}
                <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 16 }}>
                  <button className="dc-btn" style={S.btnGhost} onClick={() => setImportOpen(false)}>Cancel</button>
                </div>
              </>
            )}
            {importStep === "map" && (
              <>
                <div style={{ color: T.textSecondary, fontSize: 13, marginBottom: 12 }}>
                  {importRows.length} rows found. Match your columns to each field (unmatched fields will use a sensible default).
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
                  {Object.keys(FIELD_ALIASES).map((f) => (
                    <div key={f}>
                      <label style={S.formLabel}>{f === "name" ? "Activity name" : f.charAt(0).toUpperCase() + f.slice(1)}</label>
                      <select style={S.input} value={fieldMap[f] || ""} onChange={(e) => setFieldMap({ ...fieldMap, [f]: e.target.value })}>
                        <option value="">— none / skip —</option>
                        {importHeaders.map((h) => <option key={h} value={h}>{h}</option>)}
                      </select>
                    </div>
                  ))}
                </div>
                <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: T.text, marginBottom: 12 }}>
                  <input type="checkbox" checked={skipDup} onChange={(e) => setSkipDup(e.target.checked)} />
                  Skip rows whose name matches an activity you already have
                </label>
                <div style={{ ...S.tableWrap, maxHeight: 160, marginBottom: 14 }}>
                  <table>
                    <thead>
                      <tr>
                        <th style={S.th}>Name</th><th style={S.th}>Category</th><th style={S.th}>Cost</th><th style={S.th}>Location</th>
                      </tr>
                    </thead>
                    <tbody>
                      {importRows.slice(0, 4).map((row, i) => {
                        const t = transformRow(row);
                        return (
                          <tr key={i}>
                            <td style={S.td}>{t.name || "—"}</td>
                            <td style={S.td}>{t.categoryRaw || "—"}</td>
                            <td style={S.td}>{costDisplay(t.cost)}</td>
                            <td style={S.td}>{t.location}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
                <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
                  <button className="dc-btn" style={S.btnGhost} onClick={() => setImportOpen(false)}>Cancel</button>
                  <button className="dc-btn" style={S.btnPrimary} onClick={confirmImport}>Import {importRows.length} rows</button>
                </div>
              </>
            )}
          </div>
        </div>
      )}

      {categoryToDelete && (
        <div style={S.overlay} onClick={() => setCategoryToDelete(null)}>
          <div style={{ ...S.formBox, maxWidth: 380, textAlign: "center" }} onClick={(e) => e.stopPropagation()}>
            <div style={{ fontSize: 26, marginBottom: 8 }}>⚠️</div>
            <div style={S.formTitle}>Delete "{categoryToDelete.name}"?</div>
            <div style={{ color: T.textSecondary, fontSize: 13, marginBottom: 18, lineHeight: 1.5 }}>
              Activities in this category will be moved to <strong>Uncategorized</strong>. This can't be undone.
            </div>
            <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
              <button className="dc-btn" style={S.btnGhost} onClick={() => setCategoryToDelete(null)}>Cancel</button>
              <button className="dc-btn" style={{ ...S.btnPrimary, background: "#FF3B30" }} onClick={confirmDeleteCategory}>Delete category</button>
            </div>
          </div>
        </div>
      )}

      {bulkDeleteConfirm && (
        <div style={S.overlay} onClick={() => setBulkDeleteConfirm(false)}>
          <div style={{ ...S.formBox, maxWidth: 380, textAlign: "center" }} onClick={(e) => e.stopPropagation()}>
            <div style={{ fontSize: 26, marginBottom: 8 }}>⚠️</div>
            <div style={S.formTitle}>Delete {selectedCatIds.length} categories?</div>
            <div style={{ color: T.textSecondary, fontSize: 13, marginBottom: 18, lineHeight: 1.5 }}>
              Activities in these categories will be moved to <strong>Uncategorized</strong>. This can't be undone.
            </div>
            <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
              <button className="dc-btn" style={S.btnGhost} onClick={() => setBulkDeleteConfirm(false)}>Cancel</button>
              <button className="dc-btn" style={{ ...S.btnPrimary, background: "#FF3B30" }} onClick={confirmBulkDeleteCategories}>
                Delete {selectedCatIds.length} categories
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Lock Screen ----------

function LockScreen({ S, T, mode, passInput, setPassInput, passConfirm, setPassConfirm, lockError, onSubmit }) {
  const creating = mode === "create";
  const isSeed = mode === "seed";
  return (
    <div style={{ ...S.page, minHeight: 420, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <form onSubmit={onSubmit} style={{ ...S.formBox, maxWidth: 340, textAlign: "center" }}>
        <div style={{ fontSize: 28, marginBottom: 8 }}>🔒</div>
        <div style={S.formTitle}>{creating ? "Set a passcode" : "Enter your passcode"}</div>
        <div style={{ color: T.textSecondary, fontSize: 13, marginBottom: 16, lineHeight: 1.5 }}>
          {creating
            ? "This unlocks the app and encrypts any backups you export — use at least 8 characters."
            : isSeed
            ? "Found a saved backup — enter the passcode it was encrypted with to unlock it."
            : "Unlock to see your activities."}
        </div>
        <input
          type="password" autoFocus style={S.input}
          placeholder={creating ? "Create a passcode" : "Passcode"}
          value={passInput} onChange={(e) => setPassInput(e.target.value)}
        />
        {creating && (
          <input
            type="password" style={S.input} placeholder="Confirm passcode"
            value={passConfirm} onChange={(e) => setPassConfirm(e.target.value)}
          />
        )}
        {lockError && <div style={{ color: "#FF3B30", fontSize: 12.5, marginBottom: 8 }}>{lockError}</div>}
        <button type="submit" className="dc-btn" style={{ ...S.btnPrimary, width: "100%", padding: "11px 0", marginTop: 4 }}>
          {creating ? "Create & unlock" : "Unlock"}
        </button>
      </form>
    </div>
  );
}

    <div style={S.pageInner}>

            <div style={S.filterLabel}>Cost</div>

                return (
                  <div key={n} className="dc-chip" onClick={() => toggleMulti(costFilter, setCostFilter, n)}
                    style={{ ...S.chip, borderColor: T.accent, background: active ? T.accent : "transparent", color: active ? "#FFFFFF" : T.text }}>

                  </div>
                );
              })}

              <div style={S.filterLabel}>Weather</div>
              <div style={S.chipRow}>
                {WEATHERS.map((w) => {
                  const active = weatherFilter === w;
                  return (
                    <div key={w} className="dc-chip" onClick={() => toggleSingle(weatherFilter, setWeatherFilter, w)}

                      {w}

            <div>
              <div style={S.filterLabel}>Home or away</div>

                      {s}

                })}
              </div>
            </div>
            <div>
              <div style={S.filterLabel}>Prep needed</div>
              <div style={S.chipRow}>
                {PREPS.map((p) => {

                    <div key={p} className="dc-chip" onClick={() => toggleSingle(prepFilter, setPrepFilter, p)}

                      {p}

      <div style={S.panel}>

          {COUNT_PRESETS.map((n) => (
            <div key={n} className="dc-chip" onClick={() => setCount(n)}
              style={{ ...S.segItem, borderColor: T.accent, background: drawCount === n ? T.accent : "transparent", color: drawCount === n ? "#FFFFFF" : T.text }}>

      </div>

      <div style={{ display: "flex", justifyContent: "center", marginBottom: 20 }}>
        <button className="dc-btn" style={S.btnPrimaryLg} onClick={draw}>Surprise me</button>

      {emptyNotice && <div style={{ ...S.notice }} className="dc-in">No activities match those filters — try loosening one.</div>}

      {shuffling && (
        <div style={S.shuffleBox}>
          <span className="dc-blink" style={{ ...S.dotBig, background: T.textTertiary, animationDelay: "0s" }} />
          <span className="dc-blink" style={{ ...S.dotBig, background: T.textTertiary, animationDelay: ".2s" }} />
          <span className="dc-blink" style={{ ...S.dotBig, background: T.textTertiary, animationDelay: ".4s" }} />

      {results && results.length === 1 && !shuffling && (
        <div className="dc-flip-outer" style={S.flipOuter}>

              <div style={{ ...S.stripe, background: catById(results[0].category)?.color || T.accent }} />
              <div style={{ padding: "22px 24px" }}>
                <div style={S.eyebrowSm}>{catById(results[0].category)?.name || "Uncategorized"}</div>
                <div style={S.cardTitle}>{results[0].name}</div>
                <div style={S.cardMeta}>
                  <span>{costDisplay(results[0].cost)}</span><span>·</span>
                  <span>{results[0].location}</span><span>·</span>
                  <span>{results[0].setting}</span><span>·</span>
                  <span>{results[0].weather}</span>
                </div>
                {results[0].notes && <div style={S.cardNotes}>{results[0].notes}</div>}
                <button className="dc-btn" style={{ ...S.doneBtnCard, ...(results[0].done ? S.doneBtnCardActive : {}) }} onClick={() => toggleDone(results[0].id)}>

          </div>

      {results && results.length > 1 && (
        <div style={S.grid}>
          {results.map((a, i) => (
            <div key={a.id} className="dc-in" style={{ ...S.miniCard, animationDelay: `${i * 0.03}s` }}>
              <div style={{ ...S.stripeSm, background: catById(a.category)?.color || T.accent }} />
              <div style={{ padding: "13px 15px" }}>
                <div style={S.eyebrowSm}>{catById(a.category)?.name}</div>
                <div style={S.miniTitle}>{a.name}</div>

// ---------- Manage Page ----------

function ManagePage(props) {
  const {
    T, S, activities, allCount, search, setSearch, categories, catById,
    openAdd, openEdit, deleteActivity, toggleDone,
    showCatManager, setShowCatManager, newCatName, setNewCatName, newCatColor, setNewCatColor,
    addCategory, requestDeleteCategory, openImport,
    catSelectMode, setCatSelectMode, selectedCatIds, toggleCatSelect, setBulkDeleteConfirm,
    exportBackup, handleBackupFile, backupFileRef, backupBusy, backupMsg,
  } = props;

 const [editingCatId, setEditingCatId] = useState(null);
  const [editCatName, setEditCatName] = useState("");
  const [sortKey, setSortKey] = useState(null);
  const [sortDir, setSortDir] = useState("asc");

  function handleSort(key) {
    if (sortKey === key) {
      setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    } else {
      setSortKey(key);
      setSortDir("asc");
    }
  }

  const sortedActivities = useMemo(() => {
    if (!sortKey) return activities;
    const arr = [...activities];
    arr.sort((a, b) => {
      let av, bv;
      switch (sortKey) {
        case "name": av = a.name.toLowerCase(); bv = b.name.toLowerCase(); break;
        case "category": av = (catById(a.category)?.name || "").toLowerCase(); bv = (catById(b.category)?.name || "").toLowerCase(); break;
        case "cost": av = Math.min(...(a.cost || [1])); bv = Math.min(...(b.cost || [1])); break;
        default: av = a[sortKey]; bv = b[sortKey];
      }
      if (av < bv) return sortDir === "asc" ? -1 : 1;
      if (av > bv) return sortDir === "asc" ? 1 : -1;
      return 0;
    });
    return arr;
  }, [activities, sortKey, sortDir, catById]);

  function sortArrow(key) {
    return sortKey === key ? (sortDir === "asc" ? " ▲" : " ▼") : "";
  }

  return (
    <div style={S.pageInner}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 10, marginBottom: 4 }}>
        <div>
          <div style={S.h1}>Manage activities</div>
          <div style={S.subtext}>{allCount} total</div>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button className="dc-btn" style={S.btnGhost} onClick={openImport}>Import from Excel</button>
          <button className="dc-btn" style={S.btnPrimary} onClick={openAdd}>+ Add activity</button>
        </div>
      </div>

      <div style={{ ...S.panel, marginTop: 14 }}>
        <div style={S.filterLabel}>Encrypted backup (for syncing via GitHub)</div>
        <div style={{ color: T.textSecondary, fontSize: 12.5, marginBottom: 10, lineHeight: 1.5 }}>
          Export downloads an encrypted file with everything below — commit it to your repo to update the copy others load. Import loads one back in (your passcode decrypts it).
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
          <button className="dc-btn" style={S.btnGhost} disabled={backupBusy} onClick={exportBackup}>Export encrypted backup</button>
          <button className="dc-btn" style={S.btnGhost} disabled={backupBusy} onClick={() => backupFileRef.current?.click()}>Import encrypted backup</button>
          <input ref={backupFileRef} type="file" accept=".json" onChange={handleBackupFile} style={{ display: "none" }} />
        </div>
        {backupMsg && <div style={{ fontSize: 12.5, color: T.textSecondary, marginTop: 8 }}>{backupMsg}</div>}
      </div>

      <div style={{ display: "flex", gap: 10, margin: "18px 0 14px", flexWrap: "wrap", alignItems: "center" }}>
        <input placeholder="Search activities…" value={search} onChange={(e) => setSearch(e.target.value)} style={{ ...S.input, maxWidth: 260 }} />
        <button className="dc-btn" style={S.linkBtn} onClick={() => setShowCatManager(!showCatManager)}>
          {showCatManager ? "Hide" : "Manage"} categories
        </button>
      </div>

      {showCatManager && (
        <div style={S.catManager} className="dc-in">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <div style={S.filterLabel}>Categories</div>
            <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
              {catSelectMode && selectedCatIds.length > 0 && (
                <button className="dc-btn" style={{ ...S.linkBtn, color: "#FF3B30" }} onClick={() => setBulkDeleteConfirm(true)}>
                  Delete {selectedCatIds.length} selected
                </button>
              )}
              <button
                className="dc-btn" style={S.linkBtn}
                onClick={() => { setCatSelectMode(!catSelectMode); }}
              >
                {catSelectMode ? "Done" : "Select multiple"}
              </button>
            </div>
          </div>

         {categories.map((c) => (
            <div key={c.id} style={S.catRow}>
              {catSelectMode && (
                <input type="checkbox" checked={selectedCatIds.includes(c.id)} onChange={() => toggleCatSelect(c.id)} />
              )}
              <span style={{ position: "relative" }}>
                <span style={{ ...S.dotSm, background: c.color, cursor: "pointer", width: 14, height: 14 }}
                  onClick={(e) => { e.currentTarget.nextSibling.click(); }} />
                <input type="color" value={c.color}
                  onChange={(e) => recolorCategory(c.id, e.target.value)}
                  style={{ position: "absolute", opacity: 0, width: 14, height: 14, top: 0, left: 0, cursor: "pointer" }} />
              </span>
              {editingCatId === c.id ? (
                <input autoFocus value={editCatName}
                  onChange={(e) => setEditCatName(e.target.value)}
                  onBlur={() => { renameCategory(c.id, editCatName); setEditingCatId(null); }}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") { renameCategory(c.id, editCatName); setEditingCatId(null); }
                    if (e.key === "Escape") setEditingCatId(null);
                  }}
                  style={{ ...S.input, margin: 0, padding: "3px 6px", fontSize: 13, flex: 1 }} />
              ) : (
                <span style={{ flex: 1, color: T.text, fontSize: 13, cursor: "text" }}
                  onClick={() => { setEditingCatId(c.id); setEditCatName(c.name); }}>
                  {c.name}
                </span>
              )}
              {!catSelectMode && (
                <button className="dc-btn" style={S.xBtn} onClick={() => requestDeleteCategory(c)} title="Delete category">✕</button>
              )}
            </div>
          ))}

          <div style={{ display: "flex", gap: 8, marginTop: 10, alignItems: "center", flexWrap: "wrap" }}>
            <input placeholder="New category name" value={newCatName} onChange={(e) => setNewCatName(e.target.value)} style={{ ...S.input, flex: 1, minWidth: 140, margin: 0 }} />
            <div style={{ display: "flex", gap: 4 }}>
              {CATEGORY_PALETTE.map((sw) => (
                <span key={sw} onClick={() => setNewCatColor(sw)} style={{ width: 18, height: 18, borderRadius: "50%", background: sw, cursor: "pointer", border: newCatColor === sw ? `2px solid ${T.text}` : "2px solid transparent" }} />
              ))}
            </div>
            <button className="dc-btn" style={S.btnGhost} onClick={addCategory}>Add</button>
          </div>
        </div>
      )}

      <div style={S.tableWrap}>
        <table>
          <thead>
            <tr>
              <th style={S.th}></th>
              <th style={{ ...S.th, cursor: "pointer" }} onClick={() => handleSort("name")}>Name{sortArrow("name")}</th>
              <th style={{ ...S.th, cursor: "pointer" }} onClick={() => handleSort("category")}>Category{sortArrow("category")}</th>
              <th style={{ ...S.th, cursor: "pointer" }} onClick={() => handleSort("cost")}>Cost{sortArrow("cost")}</th>
              <th style={{ ...S.th, cursor: "pointer" }} onClick={() => handleSort("location")}>Location{sortArrow("location")}</th>
              <th style={{ ...S.th, cursor: "pointer" }} onClick={() => handleSort("setting")}>Setting{sortArrow("setting")}</th>
              <th style={{ ...S.th, cursor: "pointer" }} onClick={() => handleSort("weather")}>Weather{sortArrow("weather")}</th>
              <th style={{ ...S.th, cursor: "pointer" }} onClick={() => handleSort("prep")}>Prep{sortArrow("prep")}</th>
              <th style={S.th}></th>
            </tr>
          </thead>
          <tbody>
            {sortedActivities.map((a) => (
              <tr key={a.id} className="dc-row">
                <td style={S.td}><input type="checkbox" checked={a.done} onChange={() => toggleDone(a.id)} /></td>
                <td style={{ ...S.td, fontWeight: 500, textDecoration: a.done ? "line-through" : "none", opacity: a.done ? 0.5 : 1 }}>{a.name}</td>
                <td style={S.td}>
                  <span style={S.pill}>
                    <span style={{ ...S.dotSm, background: catById(a.category)?.color || "#999" }} />
                    {catById(a.category)?.name || "—"}
                  </span>
                </td>
                <td style={S.td}>{costDisplay(a.cost)}</td>
                <td style={S.td}>{a.location}</td>
                <td style={S.td}>{a.setting}</td>
                <td style={S.td}>{a.weather}</td>
                <td style={S.td}>{a.prep}</td>
                <td style={{ ...S.td, whiteSpace: "nowrap" }}>
                  <button className="dc-btn" style={S.xBtn} onClick={() => openEdit(a)}>Edit</button>
                  <button className="dc-btn" style={S.xBtn} onClick={() => deleteActivity(a.id)}>Delete</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        {!activities.length && <div style={{ color: T.textSecondary, fontSize: 13, padding: 16 }}>No activities match your search.</div>}
      </div>
    </div>
  );
}

// ---------- Stats Page ----------

function StatsPage({ T, S, activities, categories, catById, toggleDone, doneCount }) {
  const total = activities.length;
  const remaining = total - doneCount;
  const doneList = activities.filter((a) => a.done).sort((a, b) => (b.doneDate || "").localeCompare(a.doneDate || ""));

  const breakdown = categories.map((c) => {
    const acts = activities.filter((a) => a.category === c.id);
    const done = acts.filter((a) => a.done).length;
    return { ...c, total: acts.length, done };
  }).filter((c) => c.total > 0);

  return (
    <div style={S.pageInner}>
      <div style={S.h1}>Stats &amp; history</div>
      <div style={S.subtext}>Track what you've already done.</div>

      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", margin: "18px 0" }}>
        {[["Total activities", total], ["Done", doneCount], ["Remaining", remaining], ["Categories", categories.length]].map(([label, val]) => (
          <div key={label} style={S.statCard}>
            <div style={{ fontSize: 26, fontWeight: 700, color: T.text }}>{val}</div>
            <div style={{ fontSize: 12.5, color: T.textSecondary, marginTop: 2 }}>{label}</div>
          </div>
        ))}
      </div>

      <div style={S.panel}>
        <div style={S.filterLabel}>By category</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12, marginTop: 8 }}>
          {breakdown.map((c) => (
            <div key={c.id}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: T.text, marginBottom: 4 }}>
                <span>{c.name}</span>
                <span style={{ color: T.textSecondary }}>{c.done}/{c.total}</span>
              </div>
              <div style={{ height: 6, borderRadius: 3, background: T.bgSubtle, overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${c.total ? (c.done / c.total) * 100 : 0}%`, background: c.color, borderRadius: 3 }} />
              </div>
            </div>
          ))}
          {!breakdown.length && <div style={{ color: T.textSecondary, fontSize: 13 }}>No activities yet.</div>}
        </div>
      </div>

      <div style={S.panel}>
        <div style={S.filterLabel}>History</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 2, marginTop: 8 }}>
          {doneList.map((a) => (
            <div key={a.id} className="dc-row" style={S.listRow}>
              <span style={{ ...S.dotSm, background: catById(a.category)?.color || "#999" }} />
              <span style={{ flex: 1, color: T.text, fontSize: 13.5 }}>{a.name}</span>
              <span style={{ fontSize: 12, color: T.textSecondary }}>{a.doneDate}</span>
              <button className="dc-btn" style={S.xBtn} onClick={() => toggleDone(a.id)}>Undo</button>
            </div>
          ))}
          {!doneList.length && <div style={{ color: T.textSecondary, fontSize: 13, padding: "6px 0" }}>Nothing marked done yet — check things off from the Picker or Manage tab.</div>}
        </div>
      </div>
    </div>
  );
}

    listRow: { display: "flex", alignItems: "center", gap: 10, padding: "9px 6px", borderRadius: 6, borderBottom: `1px solid ${T.border}` },
    pill: { display: "inline-flex", alignItems: "center", gap: 6, background: T.bgSubtle, borderRadius: 999, padding: "3px 9px", fontSize: 12 },
    tableWrap: { overflow: "auto", border: `1px solid ${T.border}`, borderRadius: 12, maxHeight: "65vh" },
    th: { textAlign: "left", fontSize: 11, textTransform: "uppercase", letterSpacing: 0.4, color: T.textSecondary, padding: "10px 12px", borderBottom: `1px solid ${T.border}`, fontWeight: 600, whiteSpace: "nowrap", position: "sticky", top: 0, background: T.surface, zIndex: 1 },
    td: { padding: "10px 12px", fontSize: 13, color: T.text, borderBottom: `1px solid ${T.border}`, whiteSpace: "nowrap" },
    overlay: { position: "fixed", inset: 0, background: T.overlay, display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 20 },

  };
}

// ---------- Error boundary ----------

class ErrorBoundary extends Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("DateIdeaPicker crashed:", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ background: "#fff", color: "#1D1D1F", fontFamily: "-apple-system, sans-serif", padding: 24, borderRadius: 12, border: "1px solid #E5E5EA", maxWidth: 520, margin: "24px auto" }}>
          <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 8 }}>Something crashed</div>
          <div style={{ fontSize: 13, color: "#6E6E73", marginBottom: 12, lineHeight: 1.5 }}>
            Copy this and send it over so it can be fixed:
          </div>
          <pre style={{ background: "#F5F5F7", padding: 12, borderRadius: 8, fontSize: 11.5, overflowX: "auto", whiteSpace: "pre-wrap" }}>
            {String(this.state.error?.message || this.state.error)}
          </pre>
          <button
            onClick={async () => {
              try {
                localStorage.removeItem("dc-date:activities");
                localStorage.removeItem("dc-date:categories");
              } catch {}
              this.setState({ error: null });
            }}
            style={{ marginTop: 14, background: "#FF3B30", color: "#fff", border: "none", borderRadius: 8, padding: "9px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}
          >
            Wipe local data and reload
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

function DateIdeaPickerWithBoundary() {
  return (
    <ErrorBoundary>
      <DateIdeaPicker />
    </ErrorBoundary>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DateIdeaPickerWithBoundary />);
